<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030200">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Turf">
  <title>Turf</title>
  <style>
    /* Wufour's own faces, self-hosted (WufourType dist/golden): Wufour Sans carries Latin, Wufour Arabic
       carries Arabic, each falling through to the other for the letters it lacks. Arabic pages put the
       Arabic face first so shared glyphs (digits, punctuation) come from it. Everything else is drawn by zui. */
    @font-face { font-family: "Wufour Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/WufourSansGolden-Regular.woff2") format("woff2"); }
    @font-face { font-family: "Wufour Sans"; font-weight: 500; font-style: normal; font-display: swap; src: url("/fonts/WufourSansGolden-Medium.woff2") format("woff2"); }
    @font-face { font-family: "Wufour Sans"; font-weight: 700; font-style: normal; font-display: swap; src: url("/fonts/WufourSansGolden-Bold.woff2") format("woff2"); }
    @font-face { font-family: "Wufour Arabic"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/WufourArabicGolden-Regular.woff2") format("woff2"); }
    @font-face { font-family: "Wufour Arabic"; font-weight: 500; font-style: normal; font-display: swap; src: url("/fonts/WufourArabicGolden-Medium.woff2") format("woff2"); }
    @font-face { font-family: "Wufour Arabic"; font-weight: 700; font-style: normal; font-display: swap; src: url("/fonts/WufourArabicGolden-Bold.woff2") format("woff2"); }
    :root {
      --zui-font: 'Wufour Sans', 'Wufour Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --zui-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    /* The page, or the widget's mount when embedded (zui sets its dir from the app's language). */
    [dir="rtl"] { --zui-font: 'Wufour Arabic', 'Wufour Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    html, body { margin: 0; height: 100%; background: #D3DDE3; }
    body { font-family: var(--zui-font); -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
    /* Thin scroll bars in the palette (Turf-js: scrollbar-color var(--ink-4)). */
    * { scrollbar-width: thin; scrollbar-color: color-mix(in oklab, #AEA098 60%, transparent) transparent; }
  </style>
</head>
<body>
  <script type="module">
    // The page around the app: what a web page can do that zui does not ask the platform for.
    // The app asks with fx.post({type, ...}):
    //   print       opens an address to print (shipping labels)
    //   title / theme / lang   the tab title, the browser colour and the page language
    // (History, the clock, photos, files, downloads, sounds and the screen lock are zui's.)
    import { start } from '/zui.js';

    function onPost(text) {
      let m;
      try { m = JSON.parse(text); } catch { return; }
      switch (m.type) {
        case 'print': window.open(m.url, '_blank', 'noopener'); break;
        case 'title': document.title = m.title || 'Turf'; break;
        case 'theme': document.querySelector('meta[name="theme-color"]')?.setAttribute('content', m.color); break;
        case 'lang': document.documentElement.lang = m.lang; document.documentElement.dir = m.lang === 'ar' ? 'rtl' : 'ltr'; break;
      }
    }

    await start('/app.wasm', document.body, { onPost });
  </script>
  <script>
    // Installable, and opens offline (not inside an embed).
    if ('serviceWorker' in navigator && !location.pathname.startsWith('/embed/')) {
      addEventListener('load', () => navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {}));
    }
  </script>
</body>
</html>
